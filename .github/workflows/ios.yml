# iOS derlemesi. Mac olmadan App Store'a çıkmak için:
# - Her push/PR: testler (Linux) + imzasız iOS derlemesi (macOS), Stockfish dahil derleniyor mu diye.
# - Elle çalıştırma (Actions → iOS → Run workflow → testflight): imzalı IPA derlenir ve TestFlight'a yüklenir.
# - Elle çalıştırma (screenshots): iPhone Pro Max simülatöründe integration_test/screenshots_test.dart 4 dilde
#   koşar, ham PNG'ler "store-screenshots-ios" artifact'ı olarak iner; çerçeve: tool/branding/make_screenshots.py ios
# Gizli değerler ve kurulum: tool/ios/README.md.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "İmzalı IPA derle ve TestFlight'a yükle"
        type: boolean
        default: false
      build_number:
        description: "Derleme numarası (boşsa pubspec.yaml'daki +N)"
        type: string
        default: ""
      screenshots:
        description: "iOS simülatöründe mağaza ekran görüntüleri üret (4 dil)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Push'lar birbirini iptal eder; elle başlatılan (TestFlight, ekran görüntüsü) işler iptal edilmez.
  group: ios-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stockfish-nnue
          key: stockfish-nnue-${{ hashFiles('pubspec.lock') }}
      - name: Stockfish ağ dosyaları
        run: |
          flutter build ios --config-only --release --no-codesign
          tool/ios/fetch_nnue.sh
      - name: İmzasız iOS derlemesi (arm64, release)
        run: flutter build ios --release --no-codesign

  testflight:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.davutkeskin.chessacademy
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stockfish-nnue
          key: stockfish-nnue-${{ hashFiles('pubspec.lock') }}
      - name: Stockfish ağ dosyaları
        run: |
          flutter build ios --config-only --release --no-codesign
          tool/ios/fetch_nnue.sh

      - name: Sertifika ve profil
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          # Xcode 16+ profilleri UserData altında arar; eskiler MobileDevice altında.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          echo "::add-mask::$TEAM"  # public depo: kayıtlarda görünmesin
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"

      - name: Runner hedefini elle imzaya çevir
        # Takım kimliği depoya yazılmasın diye proje dosyası yalnızca CI'da değiştirilir.
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          target.build_configurations.each do |c|
            next unless c.name == 'Release'
            s = c.build_settings
            s['CODE_SIGN_STYLE'] = 'Manual'
            s['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
            s['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
            s['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            s['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
          end
          project.save
          RUBY
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: IPA derle
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ARGS=()
          [ -n "$BUILD_NUMBER" ] && ARGS+=(--build-number="$BUILD_NUMBER")
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" "${ARGS[@]}"
          ls -la build/ios/ipa

      - name: TestFlight'a yükle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Temizlik
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP"/profile.* || true

  screenshots:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stockfish-nnue
          key: stockfish-nnue-${{ hashFiles('pubspec.lock') }}
      - name: Stockfish ağ dosyaları
        run: |
          flutter build ios --config-only --simulator --debug
          tool/ios/fetch_nnue.sh
      - name: Simülatörü aç (6,9" iPhone)
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone [0-9]+ Pro Max$"))] | sort_by(.name) | last | .udid')
          NAME=$(xcrun simctl list devices available -j | jq -r --arg u "$UDID" '.devices[][] | select(.udid==$u) | .name')
          echo "Simülatör: $NAME ($UDID)"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Mağaza görüntüsü için temiz durum çubuğu (ekran görüntüsü Flutter yüzeyi olsa da zararsız).
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Ekran görüntüleri (tr, en, de, es)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BUNDLE: com.davutkeskin.chessacademy
        run: |
          set -euo pipefail
          # Test, uygulamanın giriş noktası olarak derlenir; görüntüleri kendi içinde yazar (sürücü/VM servisi
          # bağlantısı gerekmez; flutter drive simülatörde sık sık takılıyordu).
          for L in tr en de es; do
            echo "== $L"
            flutter build ios --simulator --debug --no-pub --target=integration_test/screenshots_test.dart \
              --dart-define=SHOT_LANG=$L --dart-define=SCREENSHOTS=true
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
            C=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            rm -rf "$C/Documents/screenshots/$L"
            xcrun simctl launch "$UDID" "$BUNDLE"
            for i in $(seq 1 72); do
              [ -f "$C/Documents/screenshots/$L/DONE" ] && break
              sleep 5
            done
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            [ -f "$C/Documents/screenshots/$L/DONE" ] || { echo "$L: süre doldu"; xcrun simctl spawn "$UDID" log show --last 8m --predicate 'process == "Runner"' --style compact | tail -80; exit 1; }
            mkdir -p "build/screenshots/$L"
            cp "$C/Documents/screenshots/$L/"*.png "build/screenshots/$L/"
            ls "build/screenshots/$L"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots-ios
          path: build/screenshots
          if-no-files-found: warn
